<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OreLavoro</title>
<meta name="description" content="Conteggio delle ore lavorative, dati salvati solo sul dispositivo.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OreLavoro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  color-scheme: light dark;
  /* scala tipografica (iOS) */
  --fs-micro:10px; --fs-caption2:11px; --fs-caption:12px; --fs-footnote:13px; --fs-subhead:15px; --fs-body:17px;
  --fs-title3:20px; --fs-title2:22px; --fs-title1:28px; --fs-large:34px; --fs-display:46px;
  /* raggi */
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:22px; --r-xl:28px; --r-pill:999px;
  /* movimento */
  --dur-fast:.15s; --dur:.25s; --dur-slow:.34s;
  /* spaziatura (base 4) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --bg:#f2f2f7; --sheet:#f2f2f7; --list:#ffffff;
  --card:rgba(255,255,255,.78); --bar:rgba(249,249,251,.82);
  --hair:rgba(0,0,0,.04);
  --text:#1c1c1e; --text2:#6a6a6f; --text3:#a1a1a6;
  --sep:rgba(60,60,67,.14); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.07);
  --accent:#4f58c8; --accent-btn:#4f58c8; --accent-soft:rgba(79,88,200,.10); --on-accent:#fff;
  --overlay:rgba(242,242,247,.72);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);
  --st-planned-bg:#eceefb; --st-planned:#4f58c8;
  --st-worked-bg:#e0efe5; --st-worked:#2d6b47;
  --st-absent-bg:#f6e9db; --st-absent:#8a5520;
  --st-holiday-bg:#f5e0e4; --st-holiday:#913c55;
  --st-pending-bg:#f8efcd; --st-pending:#755c00;
  --danger:#c4453c; --toast:rgba(28,28,30,.92); --toast-fg:#fff;
  --ease:cubic-bezier(.2,.8,.2,1); --tab-h:56px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --sheet:#1c1c1e; --list:#2c2c2e;
    --card:rgba(28,28,30,.78); --bar:rgba(22,22,24,.82);
    --hair:rgba(255,255,255,.06);
    --text:#f2f2f7; --text2:#98989f; --text3:#636366;
    --sep:rgba(84,84,88,.5); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.13);
    --accent:#9ba1f4; --accent-btn:#5a62d6; --accent-soft:rgba(127,135,238,.16); --on-accent:#fff;
    --overlay:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
    --st-planned-bg:#25284a; --st-planned:#a9aef6;
    --st-worked-bg:#1b3325; --st-worked:#7fc69b;
    --st-absent-bg:#3a2b1c; --st-absent:#e0a96f;
    --st-holiday-bg:#3b2027; --st-holiday:#e892a4;
    --st-pending-bg:#38310f; --st-pending:#e2c45c;
    --danger:#f0776d; --toast:rgba(242,242,247,.94); --toast-fg:#000;
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);
  background:radial-gradient(900px 420px at 50% -160px,var(--accent-soft),transparent 70%) no-repeat,var(--bg);
  font:17px/1.38 -apple-system,BlinkMacSystemFont,system-ui,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text2);font-size:var(--fs-subhead);margin:4px 0 0}
.mt{margin-top:12px}
[hidden]{display:none!important}

#view{max-width:640px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px) max(16px,env(safe-area-inset-left))}
.top .badge{margin-left:6px;vertical-align:1px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 4px 14px}
.eyebrow{font-size:var(--fs-footnote);font-weight:600;color:var(--text2);letter-spacing:.01em}
h1{font-size:var(--fs-large);line-height:1.1;font-weight:700;letter-spacing:-.022em;margin:2px 0 0}
h2{font-size:var(--fs-title3);line-height:1.25;font-weight:600;letter-spacing:-.012em;margin:0}
.card{background:var(--card);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  border-radius:var(--r-lg);box-shadow:var(--shadow);border:.5px solid var(--hair);padding:16px;margin-bottom:14px}
.label{font-size:var(--fs-footnote);font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.big{font-size:var(--fs-large);font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:3px 0 2px}
.mid{font-size:var(--fs-title1);font-weight:600;letter-spacing:-.015em;line-height:1.2;margin:3px 0 2px}

/* pill / banner / link */
.status-row{margin:-4px 2px 14px}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px 0 11px;border-radius:var(--r-pill);font-size:var(--fs-subhead);font-weight:600}
.pill svg{width:18px;height:18px}
.pill.warn{background:var(--st-pending-bg);color:var(--st-pending)}
.pill.ok{background:var(--st-worked-bg);color:var(--st-worked)}
.pill.sm{min-height:32px;font-size:var(--fs-footnote)}
.link{color:var(--accent);font-weight:600;font-size:var(--fs-subhead);min-height:44px;padding:0 6px;display:inline-flex;align-items:center;gap:2px}
.link svg{width:16px;height:16px}
.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px 10px 14px;border-radius:var(--r-md);
  background:var(--st-pending-bg);margin-bottom:12px;min-height:58px}
.banner>svg:first-child{color:var(--st-pending)}
.banner>svg:last-child{color:var(--text3);width:18px;height:18px}
.banner .bt{flex:1;display:flex;flex-direction:column;min-width:0}
.banner .bt b{font-size:var(--fs-subhead);font-weight:600}
.banner .bt span{font-size:var(--fs-footnote);color:var(--text2)}
.banner.subtle{background:var(--fill2)}
.banner.subtle>svg:first-child{color:var(--accent)}
.banner .x{width:40px;height:44px;display:grid;place-items:center;color:var(--text3);font-size:var(--fs-title2)}

/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:-6px -6px 10px}
.cal-head h2{font-size:var(--fs-title3)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-md);color:var(--accent);transition:background var(--dur)}
.icon-btn:active{background:var(--fill)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:var(--fs-caption);font-weight:600;color:var(--text3);margin-bottom:6px}
.grid-wrap{overflow:hidden;touch-action:pan-y;margin:-4px;padding:4px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.grid.in-r{animation:inR var(--dur-slow) var(--ease)}
.grid.in-l{animation:inL var(--dur-slow) var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}}
.day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:50px;min-width:0;
  border-radius:var(--r-md);color:var(--text2);transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.day .n{font-size:var(--fs-body);font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.day .sub{font-size:var(--fs-micro);line-height:1;min-height:10px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.day:active{transform:scale(.93)}
.day.sel{transform:scale(1.1);z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.day.blank{pointer-events:none}
.day.today::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--accent)}
.day.today .n{font-weight:700}
.day.has-ov::before{content:"";position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.s-planned{background:var(--st-planned-bg);color:var(--st-planned)}
.s-worked{background:var(--st-worked-bg);color:var(--st-worked)}
.s-absent{background:var(--st-absent-bg);color:var(--st-absent)}
.s-holiday{background:var(--st-holiday-bg);color:var(--st-holiday)}
.s-pending{background:var(--st-pending-bg);color:var(--st-pending);outline:1.5px dashed var(--st-pending);outline-offset:-1.5px}
.s-off{background:transparent}
.today-link{display:flex;margin:6px auto -6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0 6px 16px;font-size:var(--fs-footnote);color:var(--text2)}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.sw.s-planned{background:var(--st-planned)}.sw.s-worked{background:var(--st-worked)}.sw.s-absent{background:var(--st-absent)}
.sw.s-holiday{background:var(--st-holiday)}.sw.s-pending{background:var(--st-pending-bg);outline-width:1.5px}
.today-card{display:flex;justify-content:space-between;gap:16px;cursor:pointer}
.today-card .tc-l{min-width:0}
.tc-r{text-align:right;flex:none}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
  border-top:.5px solid var(--sep);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);view-transition-name:tabbar}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--tab-h);font-size:var(--fs-caption2);font-weight:600;color:var(--text3);position:relative;transition:color var(--dur)}
.tab svg{width:25px;height:25px}
.tab[aria-current=page]{color:var(--accent)}
.tab .dot{position:absolute;top:5px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-sm);background:var(--st-pending);color:#fff;font-size:var(--fs-caption2);line-height:18px;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme: dark){.tab .dot{color:#000}}

/* sheet */
.sheet-layer{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;transition:opacity var(--dur-slow) var(--ease)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--sheet);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:6px 16px calc(env(safe-area-inset-bottom) + 20px);
  transform:translateY(100%);transition:transform var(--dur-slow) var(--ease);box-shadow:0 -8px 30px rgba(0,0,0,.14)}
.sheet-layer.open .backdrop{opacity:1}
.sheet-layer.open .sheet{transform:none}
.sheet-layer.center .sheet{top:50%;bottom:auto;left:16px;right:16px;max-width:380px;border-radius:var(--r-lg);padding:22px 20px 18px;
  transform:translateY(-50%) scale(.94);opacity:0;transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.sheet-layer.center.open .sheet{transform:translateY(-50%);opacity:1}
.center .grabber{display:none}
.center h2{margin-bottom:6px}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--fill);margin:2px auto 8px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:2px 0 14px}
.close{width:44px;height:44px;display:grid;place-items:center;margin:-6px -10px 0 0;color:var(--text2)}
.close span{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.close svg{width:16px;height:16px;stroke-width:2.2}
.group-title{font-size:var(--fs-footnote);font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:22px 16px 8px}
.list{background:var(--list);border-radius:var(--r-md);overflow:hidden}
#view .list{background:var(--card);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--shadow);border:.5px solid var(--hair)}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:6px 16px;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.li>span:first-child{display:flex;flex-direction:column}
.li small,.sub2{display:block;font-size:var(--fs-footnote);color:var(--text2)}
.li-main{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;min-height:44px}
.li-main .muted{margin:0;font-size:var(--fs-footnote);white-space:nowrap}
.caption{font-size:var(--fs-footnote);color:var(--text2);margin:8px 16px 0}
.tag{font-size:var(--fs-caption);font-weight:600;padding:3px 8px;border-radius:var(--r-xs);background:var(--accent-soft);color:var(--accent);flex:none}

/* form */
input[type=time],input[type=date],select,.inp{-webkit-appearance:none;appearance:none;background:var(--fill);border:0;border-radius:var(--r-sm);
  padding:7px 10px;min-height:38px;min-width:96px;font-size:var(--fs-body);font-variant-numeric:tabular-nums;color:var(--text);text-align:center}
.inp.wide{width:100%;text-align:left;background:transparent;padding-left:0}
textarea{display:block;width:100%;background:var(--list);border:0;border-radius:var(--r-md);padding:12px 14px;font-size:var(--fs-body);min-height:72px;resize:vertical;color:var(--text)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:var(--r-sm)}
.stepper button{width:44px;height:38px;font-size:var(--fs-title2);line-height:1;color:var(--accent);display:grid;place-items:center}
.stepper output{min-width:50px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
.switch{position:relative;display:inline-block;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:var(--r-pill);background:var(--fill);transition:background var(--dur)}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.22);transition:transform var(--dur) var(--ease)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}
.seg{display:flex;background:var(--fill);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:var(--r-sm);font-size:var(--fs-subhead);font-weight:600;color:var(--text2);transition:background var(--dur),color var(--dur)}
.seg button[aria-pressed=true]{background:var(--list);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 16px;border-radius:var(--r-pill);background:var(--fill);font-size:var(--fs-subhead);font-weight:600;transition:background var(--dur),color var(--dur)}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.ovf{display:none}
.sheet[data-ov=orario] .ovf-time,.sheet[data-ov=extra] .ovf-time,.sheet[data-ov=festivo] .ovf-hol,.sheet[data-ov] .ovf-any{display:block}
.sheet[data-stato=assenza] .f-work,.sheet[data-stato=lavorato] .f-abs{display:none}

/* bottoni */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:var(--r-md);background:var(--fill);color:var(--accent);
  font-size:var(--fs-body);font-weight:600;transition:transform var(--dur-fast) var(--ease),opacity var(--dur-fast)}
.btn:active{transform:scale(.97);opacity:.85}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.big{min-height:58px;font-size:var(--fs-title3)}
.btn svg{width:20px;height:20px}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}

/* conferma presenza */
.cf-overlay{position:fixed;inset:0;z-index:60;background:var(--overlay);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);opacity:0;transition:opacity var(--dur) var(--ease)}
.cf-overlay.open{opacity:1}
.cf-wrap{width:100%;max-width:420px;margin:auto}
.cf-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cf-stage{position:relative}
.cf-card{background:var(--list);border-radius:var(--r-xl);padding:22px 20px 20px;box-shadow:0 24px 60px rgba(0,0,0,.16);animation:cfIn var(--dur-slow) var(--ease) both}
.cf-card.leave{position:absolute;top:0;left:0;right:0;animation:cfOut var(--dur-slow) var(--ease) forwards;pointer-events:none}
@keyframes cfIn{from{opacity:0;transform:scale(.94)}}
@keyframes cfOut{to{opacity:0;transform:translateX(-70%)}}
.cf-card .list{background:var(--fill2)}
.cf-card textarea{background:var(--fill2)}
.cf-date{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:var(--fs-subhead)}
.cf-date svg{width:19px;height:19px}
.cf-q{font-size:var(--fs-title1);line-height:1.18;letter-spacing:-.022em;font-weight:700;margin:12px 0 6px}
.cf-q.sm{font-size:var(--fs-title2)}
.cf-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.calc{display:flex;justify-content:space-between;gap:10px;background:var(--fill2);border-radius:var(--r-md);padding:11px 14px;margin-top:12px;font-size:var(--fs-footnote);color:var(--text2)}
.calc b{color:var(--text);font-size:var(--fs-body);font-weight:600;margin-left:4px}

/* mese */
.mnav{display:flex;justify-content:space-between;margin:-8px -2px 8px}
.badge{display:inline-block;font-size:var(--fs-caption2);font-weight:700;letter-spacing:.08em;padding:5px 9px;border-radius:var(--r-xs);white-space:nowrap;margin-bottom:5px}
.badge.prov{background:var(--st-pending-bg);color:var(--st-pending)}
.badge.def{background:var(--st-worked-bg);color:var(--st-worked)}
.badge.sm{font-size:var(--fs-micro);padding:3px 6px;margin:0}
.badge.appear{animation:badgeIn .45s .55s var(--ease) both}
@keyframes badgeIn{from{opacity:0;transform:scale(.85)}}
.totals .hero{font-size:var(--fs-display);font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:6px 0 14px}
.totals .hero small{font-size:var(--fs-title3);color:var(--text2);font-weight:500;margin-left:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--fill2);border-radius:var(--r-md);padding:10px 12px}
.tile .v{display:block;font-size:var(--fs-title2);font-weight:600;letter-spacing:-.01em}
.tile .l{font-size:var(--fs-footnote);color:var(--text2)}
.tile.ot .v{color:var(--accent)}
.abs-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.abs-chips span{font-size:var(--fs-footnote);padding:5px 10px;border-radius:var(--r-pill);background:var(--st-absent-bg);color:var(--st-absent);font-weight:600}
.rows{padding:0;overflow:hidden}
.mrow{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 16px 9px 14px;min-height:60px;position:relative;transition:background var(--dur-fast)}
.mrow:active{background:var(--fill2)}
.mrow+.mrow::after{content:"";position:absolute;top:0;left:66px;right:0;height:.5px;background:var(--sep)}
.mrow .bar{position:absolute;left:0;top:14px;bottom:14px;width:3.5px;border-radius:0 3px 3px 0}
.bar.s-worked{background:var(--st-worked)}.bar.s-absent{background:var(--st-absent)}.bar.s-holiday{background:var(--st-holiday)}
.bar.s-pending{background:var(--st-pending);outline:0}.bar.s-planned{background:var(--st-planned);opacity:.45}
.mdate{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.mdate b{font-size:var(--fs-title3);font-weight:600}
.mdate small{font-size:var(--fs-caption2);color:var(--text2);font-weight:600;text-transform:uppercase}
.mmain{display:flex;flex-direction:column;min-width:0}
.mt-t{font-size:var(--fs-body);font-weight:500;font-variant-numeric:tabular-nums}
.ms{font-size:var(--fs-footnote);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.dim .mt-t{color:var(--text2)}
.mrow.pend .mt-t{color:var(--st-pending);font-weight:600}
.mright{display:flex;flex-direction:column;align-items:flex-end}
.mright b{font-size:var(--fs-body);font-weight:600}
.mright .ot{font-size:var(--fs-caption);color:var(--accent);font-weight:600}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.closebox{margin-bottom:14px}
.closebox p{margin:0 0 12px;font-size:var(--fs-subhead);color:var(--text2)}
.note-line{display:flex;gap:10px;align-items:center;color:var(--text2);font-size:var(--fs-footnote);margin:0 6px 14px}
.note-line svg{width:18px;height:18px}

/* archivio */
.yr-head{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 8px}
.yr-head h2{font-size:var(--fs-title2)}
.arch-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acard{text-align:left;margin:0;padding:14px;display:flex;flex-direction:column;gap:3px;transition:transform var(--dur-fast) var(--ease)}
.acard:active{transform:scale(.97)}
.ac-top{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.ac-h{font-size:var(--fs-title1);font-weight:600;letter-spacing:-.02em;margin-top:4px}
.ac-h small{font-size:var(--fs-subhead);color:var(--text2);font-weight:500}
.ac-meta{font-size:var(--fs-footnote);color:var(--text2)}
.empty{text-align:center;padding:56px 24px;color:var(--text2)}
.empty svg{width:46px;height:46px;color:var(--text3);margin-bottom:10px;stroke-width:1.4}
.empty h2{color:var(--text);margin-bottom:6px}
.back{margin:0 0 -6px -8px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0}
table.yt{border-collapse:collapse;font-size:var(--fs-footnote);white-space:nowrap;width:100%}
.yt th{font-size:var(--fs-caption);color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.03em;text-align:right;padding:8px 10px}
.yt td{text-align:right;padding:10px;border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.yt th:first-child,.yt td:first-child{text-align:left;position:sticky;left:0;background:var(--list)}
.yt tfoot td{font-weight:700}
.yt .p{color:var(--st-pending);font-size:var(--fs-caption2);font-weight:700;margin-left:4px}

/* animazioni conferma mese */
.check-pop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none}
.check-pop .ring{width:116px;height:116px;border-radius:var(--r-xl);background:var(--list);box-shadow:0 20px 50px rgba(0,0,0,.18);display:grid;place-items:center;
  animation:popIn var(--dur-slow) var(--ease) both,popOut var(--dur-slow) 1.05s var(--ease) forwards}
.check-pop svg{width:66px;height:66px;stroke:var(--st-worked);stroke-width:2.4}
.check-pop path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s var(--dur) var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}}
@keyframes popOut{to{opacity:0;transform:scale(.95)}}

#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,10px);background:var(--toast);color:var(--toast-fg);
  padding:10px 18px;border-radius:var(--r-pill);font-size:var(--fs-subhead);font-weight:500;opacity:0;pointer-events:none;transition:opacity var(--dur),transform var(--dur) var(--ease);z-index:90;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

::view-transition-old(root),::view-transition-new(root){animation-duration:.2s;animation-timing-function:var(--ease)}
.view-fade{animation:fade var(--dur) var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}

@media (min-width:700px){
  h1{font-size:var(--fs-large)}
  .arch-grid{grid-template-columns:repeat(3,1fr)}
}

@media (prefers-reduced-motion: reduce){
  .grid.in-r,.grid.in-l{animation:fade var(--dur)}
  .sheet{transform:none!important;opacity:0;transition:opacity var(--dur)}
  .sheet-layer.open .sheet{opacity:1}
  .sheet-layer.center .sheet{transform:translateY(-50%)!important}
  .cf-card{animation:fade var(--dur) both}
  .cf-card.leave{animation:fadeOut var(--dur) forwards}
  .day.sel,.day:active,.btn:active,.acard:active{transform:none}
  .check-pop .ring{animation:fade var(--dur) both,fadeOut var(--dur-slow) 1.05s forwards}
  .check-pop path{animation:none;stroke-dashoffset:0}
  .badge.appear{animation:fade var(--dur-slow) var(--dur-slow) both}
  #toast{transform:translate(-50%,0)}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.15s}
}

/* stampa / PDF */
#print-area{display:none}
@media print{

  #print-area table{width:100%;border-collapse:collapse}
  #print-area th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.04em;color:#555;border-bottom:1pt solid #999;padding:4pt}
  #print-area td{padding:3pt 4pt;border-bottom:.5pt solid #ddd;font-variant-numeric:tabular-nums;vertical-align:top}
  #print-area .r{text-align:right}

  #print-area tr.dim td{color:#999}
  #print-area tfoot td{font-weight:700;border-top:1pt solid #999;border-bottom:0}
  .p-tot{display:grid;grid-template-columns:repeat(5,1fr);gap:6pt;margin-top:12pt}
  .p-tot div{border:.75pt solid #ccc;border-radius:4pt;padding:6pt}

  .p-tot span{font-size:7.5pt;color:#555;text-transform:uppercase;letter-spacing:.04em}

  .p-sign{margin-top:30pt;display:flex;gap:40pt}

  .p-foot{margin-top:14pt;font-size:7.5pt;color:#777;display:flex;justify-content:space-between}
}

<script>
'use strict';
/* ================= Utilità ================= */
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const GG=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const ASSENZE={ferie:'Ferie',malattia:'Malattia',permesso:'Permesso',smart:'Smart working',altro:'Altro'};
const ABBR={ferie:'ferie',malattia:'mal.',permesso:'perm.',smart:'smart',altro:'ass.'};
const $=(s,r=document)=>r.querySelector(s);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const todayStr=()=>ymd(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const ymOf=s=>s.slice(0,7);
const ymAdd=(ym,n)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const ymLabel=ym=>`${cap(MESI[+ym.slice(5)-1])} ${ym.slice(0,4)}`;
const monthName=ym=>MESI[+ym.slice(5)-1];
const daysInMonth=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();};
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;};
const fromMin=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const ERR_TIME="L'uscita non può coincidere con l'ingresso";
const fmtHM=min=>{if(min==null||isNaN(min))return '—';const s=min<0?'-':'';min=Math.abs(Math.round(min));return `${s}${Math.floor(min/60)}:${pad(min%60)}`;};
const fmtDec=min=>(Math.round(min)/60).toFixed(2).replace('.',',');
const fmtIt=ds=>{const[y,m,d]=ds.split('-');return `${d}/${m}/${y}`;};
const dayLabel=ds=>{const d=parse(ds);return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const iso=()=>new Date().toISOString();

const ICON={
  cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  month:'<svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
  arch:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V9M10 13h4"/></svg>',
  set:'<svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  alert:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.3v.1"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19.5h14"/></svg>',
  print:'<svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 5 9h14a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 19 17h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/></svg>',
  table:'<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/></svg>',

/* ================= Festività ================= */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
const NAZ=[['01-01','Capodanno'],['01-06','Epifania'],['04-25','Festa della Liberazione'],['05-01','Festa dei Lavoratori'],
  ['06-02','Festa della Repubblica'],['08-15','Ferragosto'],['10-04',"San Francesco d'Assisi",2026],['11-01','Ognissanti'],
  ['12-08','Immacolata Concezione'],['12-25','Natale'],['12-26','Santo Stefano']];
function nationalHolidays(y){const o={};for(const[md,n,from]of NAZ){if(from&&y<from)continue;o[`${y}-${md}`]=n;}
  const e=easter(y);o[ymd(e)]='Pasqua';o[ymd(addDays(e,1))]="Lunedì dell'Angelo (Pasquetta)";return o;}
let holCache={};
function holidaysOf(y){if(holCache[y])return holCache[y];const o=nationalHolidays(y);
  for(const h of S.settings.customHolidays){const k=`${y}-${h.md}`;if(!o[k])o[k]=h.name;}return holCache[y]=o;}
const holidayName=ds=>holidaysOf(+ds.slice(0,4))[ds]||null;

/* ================= Stato e salvataggio ================= */
function weeklyDefault(){const w={};for(let i=0;i<7;i++)w[i]={on:i>=1&&i<=5,start:'09:00',end:'17:00'};return w;}
function defaults(){return{version:2,
  settings:{weekly:weeklyDefault(),dailyMin:480,startDate:todayStr(),customHolidays:[]},
  overrides:{},records:{},fuori:{},months:{},
  meta:{installedAt:iso(),lastBackup:null,noticeShown:{},backupSnoozeUntil:0,fbAsked:null}};}
function normalize(d){const b=defaults();if(!d||typeof d!=='object')return b;const s=d.settings||{};
  const weekly={};for(let i=0;i<7;i++){const w={...b.settings.weekly[i],...((s.weekly||{})[i]||{})};weekly[i]={on:!!w.on,fb:!!w.fb,start:w.start,end:w.end};}
  const overrides={};for(const[k,o]of Object.entries(d.overrides||{})){const n={...o};delete n.pause;if(n.tipo==='extra')n.tipo='orario';overrides[k]=n;}
  return{version:2,
    settings:{weekly,dailyMin:+(s.dailyMin??s.contractMin??480),startDate:s.startDate||b.settings.startDate,customHolidays:s.customHolidays||[]},
    overrides,records:d.records||{},fuori:migrateFuori(d.fuori),months:d.months||{},meta:{...b.meta,...(d.meta||{})}};}
function migrateFuori(f){const o={};for(const[k,v]of Object.entries(f||{})){o[k]=v.stato?{...v}:{stato:'si',paid:false,...v};}return o;}
let S=defaults();

const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('ore-lavoro',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  get(k){return new Promise((res,rej)=>{const r=this.db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  set(k,v){return new Promise((res,rej)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}};
let useLS=false;
async function load(){

}
function save(){const txt=JSON.stringify(S);
  if(useLS){try{localStorage.setItem('ore-lavoro',txt);}catch(e){toast('Impossibile salvare i dati');}return;}
  DB.set('state',txt).catch(()=>{useLS=true;try{localStorage.setItem('ore-lavoro',txt);}catch(e){}});}

/* ================= Logica ================= */
const isFinal=ym=>S.months[ym]?.stato==='definitiva';
function planFor(ds){
  const ov=S.overrides[ds],hol=holidayName(ds),w=S.settings.weekly[parse(ds).getDay()];
  if(ov){
    if(ov.tipo==='riposo')return{working:false,kind:'riposo',hol};
    if(ov.tipo==='ferie')return{working:false,kind:'ferie',note:ov.note||'',hol};
    if(ov.tipo==='festivo')return{working:false,kind:'festivo',hol:ov.nome||'Festività locale'};
    return{working:true,kind:ov.tipo==='fuori'?'fuori':'orario',fb:ov.tipo==='fuori',start:ov.start,end:ov.end,hol};
  }
  if(hol)return{working:false,kind:'festivo',hol};
  if(w.on)return{working:true,kind:w.fb?'fuori':'ordinario',fb:!!w.fb,start:w.start,end:w.end};
  return{working:false,kind:'libero'};
}
/* piano senza le ferie programmate: serve per capire quali giorni sarebbero lavorativi */
function basePlan(ds){const ov=S.overrides[ds];if(ov?.tipo!=='ferie')return planFor(ds);delete S.overrides[ds];const p=planFor(ds);S.overrides[ds]=ov;return p;}
function ferieDays(from,to){const out=[];let d=parse(from);const end=parse(to);let g=0;
  while(d<=end&&g++<400){const ds=ymd(d),p=basePlan(ds);if(p.working&&!p.fb&&!S.records[ds]&&!isFinal(ymOf(ds)))out.push(ds);d=addDays(d,1);}return out;}
function ferieGroups(){const ds=Object.keys(S.overrides).filter(k=>S.overrides[k].tipo==='ferie'&&!S.records[k]).sort();const g=[];
  for(const d of ds){const last=g[g.length-1];if(last&&(parse(d)-parse(last.to))/864e5<=4){last.to=d;last.days.push(d);}else g.push({from:d,to:d,days:[d],note:S.overrides[d].note||''});}return g;}
/* le ferie programmate diventano assenze registrate quando arriva il giorno */
function autoFerie(){const t=todayStr();let n=0;
  for(const[ds,ov]of Object.entries(S.overrides)){if(ov.tipo!=='ferie'||ds>t||S.records[ds]||isFinal(ymOf(ds))||ds<S.settings.startDate)continue;
    S.records[ds]={stato:'assenza',tipo:'ferie',note:ov.note||'',auto:true,at:iso()};n++;}
  if(n)save();return n;}
function spanMin(start,end){const s=toMin(start),e=toMin(end);if(s==null||e==null)return 0;let d=e-s;if(d<0)d+=1440;return d;}
const endFrom=start=>fromMin(((toMin(start)||0)+S.settings.dailyMin)%1440);
function calcRec(r){
  if(!r||r.stato!=='lavorato')return{worked:0};
  if(r.frozen)return{worked:r.frozen.worked};
  return{worked:spanMin(r.start,r.end)};
}
const fbOf=ds=>{const f=S.fuori[ds];return f&&f.stato!=='no'?f:null;};
const fbMin=ds=>{const f=fbOf(ds);return f?spanMin(f.start,f.end):0;};
const fbUnpaid=()=>Object.keys(S.fuori).filter(ds=>{const f=fbOf(ds);return f&&!f.paid;}).sort();
function monthTotals(ym){
  const t={worked:0,days:0,abs:{},absDays:0};
  for(const[d,r]of Object.entries(S.records)){if(ymOf(d)!==ym)continue;
    if(r.stato==='lavorato'){t.worked+=calcRec(r).worked;t.days++;}
    else if(r.stato==='assenza'){t.abs[r.tipo]=(t.abs[r.tipo]||0)+1;t.absDays++;}}
  return t;
}
const totalsFor=ym=>isFinal(ym)&&S.months[ym].totals?S.months[ym].totals:monthTotals(ym);
const avgDay=t=>t.days?t.worked/t.days:0;
function isStarted(ds,p){const t=todayStr();return ds<t||(ds===t&&nowMin()>=toMin(p.start));}
function pendingList(){
  const out=[],t=todayStr();let d=parse(S.settings.startDate),g=0;const end=parse(t);
  while(d<=end&&g++<5000){const ds=ymd(d);
    const p=planFor(ds);
    if(p.working&&isStarted(ds,p)&&(p.fb?!(S.fuori[ds]||S.records[ds]):(!S.records[ds]&&!isFinal(ymOf(ds)))))out.push(ds);
    d=addDays(d,1);}
  return out;
}
/* stato del giorno; table=true ignora tutto ciò che è fuori busta (tabella mensile, CSV, PDF) */
function dayStatus(ds,table=false){
  const r=S.records[ds];if(r)return r.stato==='lavorato'?'worked':'absent';
  const p=planFor(ds);
  if(!table){const f=fbOf(ds);if(f)return f.paid?'worked':'fb';}
  if(p.kind==='festivo')return 'holiday';
  if(p.kind==='ferie')return 'vac';
  if(p.working){
    if(p.fb){if(table)return 'off';return isStarted(ds,p)&&ds>=S.settings.startDate&&!S.fuori[ds]?'pending':(S.fuori[ds]?'off':'fbplan');}
    if(ds>=S.settings.startDate&&!isFinal(ymOf(ds))&&isStarted(ds,p))return 'pending';return 'planned';}
  return 'off';
}
/* sabato di riferimento per la richiesta di pagamento */
function payWeek(){const now=new Date();let d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  while(d.getDay()!==6)d=addDays(d,-1);let sat=ymd(d);
  if(sat===todayStr()){const p=planFor(sat);const endM=p.working?toMin(p.end):18*60;if(nowMin()<endM)sat=ymd(addDays(d,-7));}
  return{sat,list:fbUnpaid().filter(ds=>ds<=sat)};}
function closedMonths(){
  const out=[],cur=ymOf(todayStr());let ym=ymOf(S.settings.startDate),g=0;
  while(ym<cur&&g++<600){if(!isFinal(ym))out.push(ym);ym=ymAdd(ym,1);}
  return out;
}
function finalize(ym){
  for(const[d,r]of Object.entries(S.records)){if(ymOf(d)===ym){delete r.frozen;r.frozen=calcRec(r);}}
  S.months[ym]={stato:'definitiva',chiusoIl:iso(),totals:monthTotals(ym)};
}
function backupDue(){const ref=Date.parse(S.meta.lastBackup||S.meta.installedAt)||Date.now();
  return Date.now()-ref>30*864e5&&Date.now()>(S.meta.backupSnoozeUntil||0);}
function lastBackupText(){if(!S.meta.lastBackup)return 'Non hai ancora esportato un backup.';
  const d=new Date(S.meta.lastBackup);const days=Math.floor((Date.now()-d)/864e5);
  return `Ultimo backup: ${d.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})}${days>0?` (${days} ${days===1?'giorno':'giorni'} fa)`:' (oggi)'}`;}

/* righe del mese, condivise da elenco, CSV e stampa (le ore fuori busta non compaiono) */
function monthRows(ym,all=false){const out=[];
  for(let d=1;d<=daysInMonth(ym);d++){const ds=`${ym}-${pad(d)}`,r=S.records[ds],p=planFor(ds),st=dayStatus(ds,true);
    if(!all&&st==='off'&&!r)continue;out.push({ds,r,p,st,c:calcRec(r)});}
  return out;}
function rowInfo({ds,r,p,st,c}){const t=todayStr();
  if(r&&r.stato==='lavorato')return{title:`${r.start} – ${r.end}`,sub:r.note||'',hours:fmtHM(c.worked),type:'Lavorato'};
  if(r)return{title:ASSENZE[r.tipo]||'Assenza',sub:r.note||'Assenza',hours:'—',type:ASSENZE[r.tipo]||'Assenza'};
  if(st==='holiday')return{title:p.hol,sub:'Festivo',hours:'',type:'Festivo'};
  if(st==='vac')return{title:'Ferie programmate',sub:p.note||'',hours:'',type:'Ferie programmate'};
  if(st==='pending')return{title:'Da confermare',sub:`Previsto ${p.start} – ${p.end}`,hours:'—',type:'Da confermare'};
  if(st==='planned'){const fut=ds>t;return{title:fut?'Programmato':'Non registrato',sub:`${p.start} – ${p.end}`,hours:'',type:fut?'Programmato':'Non registrato'};}
  return{title:'Riposo',sub:'',hours:'',type:'Riposo'};
}

  const go=()=>{ui.tab=t;if(t==='imp'&&!S.meta.setupSeen){S.meta.setupSeen=true;save();}if(t!=='arch'){ui.archYm=null;ui.archYear=null;}render();window.scrollTo(0,0);};

function runCounters(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,key=el.dataset.key,hm=el.dataset.fmt==='hm';
    const f=v=>hm?fmtHM(v):String(Math.round(v));
    const from=key in prevVals?prevVals[key]:to;prevVals[key]=to;
    if(from===to||reduced()){el.textContent=f(to);return;}
    const t0=performance.now(),D=480;el.textContent=f(from);
    const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);el.textContent=f(from+(to-from)*e);if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}

    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){swipedAt=Date.now();calShift(dx<0?1:-1);}},{passive:true});}

/* --- dettaglio giorno (bottom sheet) --- */
const ST_LABEL={planned:'Programmato',worked:'Lavorato',absent:'Assenza',holiday:'Festivo',pending:'Da confermare',off:'Giorno libero',vac:'Ferie programmate',fb:'Fuori busta da pagare',fbplan:'Fuori busta programmato'};
function planText(p){
  if(p.working)return `${p.start} – ${p.end} · ${fmtHM(spanMin(p.start,p.end))} h${p.fb?' · fuori busta':''}`;
  if(p.kind==='festivo')return `Festività: ${esc(p.hol)}`;
  if(p.kind==='ferie')return `Ferie programmate${p.note?` · ${esc(p.note)}`:''}`;
  return p.kind==='riposo'?'Giorno non lavorativo':'Giorno libero';}
function recText(r){
  if(r.stato==='lavorato')return `<span>${r.start} – ${r.end}<small>${fmtHM(calcRec(r).worked)} h lavorate${r.note?` · ${esc(r.note)}`:''}</small></span>`;
  return `<span>${ASSENZE[r.tipo]||'Assenza'}<small>${r.note?esc(r.note):'Assenza registrata'}</small></span>`;}
function openDay(ds){
  const p=planFor(ds),r=S.records[ds],ov=S.overrides[ds],fb=fbOf(ds),st=dayStatus(ds),fin=isFinal(ymOf(ds)),t=todayStr();
  let h=sheetHead(fb&&!r?(fb.paid?'Fuori busta pagato':'Fuori busta da pagare'):ST_LABEL[st],`${cap(dayLabel(ds))} ${ds.slice(0,4)}`);
  h+=`<div class="group-title" style="margin-top:4px">Programma</div><div class="list"><div class="li"><span>${planText(p)}</span>${ov?'<span class="tag">Solo questo giorno</span>':''}</div></div>`;
  if(r){h+=`<div class="group-title">Registrato</div><div class="list"><div class="li">${recText(r)}${fin?'':`<button class="link" data-act="editRec" data-d="${ds}">Modifica</button>`}</div></div>`;}
  else if(st==='pending')h+=`<button class="btn primary block mt" data-act="confirmOne" data-d="${ds}">Conferma questo giorno</button>`;
  else if(!p.fb&&ds<=t&&!fin&&ds>=S.settings.startDate)h+=`<button class="btn block mt" data-act="editRec" data-d="${ds}">Registra ore o assenza</button>`;
  if(fb)h+=`<div class="group-title">Fuori busta</div><div class="list"><div class="li"><span>${fb.start} – ${fb.end}<small>${fmtHM(fbMin(ds))} h${fb.note?` · ${esc(fb.note)}`:''}</small></span><button class="link" data-act="editFb" data-d="${ds}">Modifica</button></div>
    <div class="li"><span>Pagato${fb.paid&&fb.paidAt?`<small>Segnato il ${new Date(fb.paidAt).toLocaleDateString('it-IT')}</small>`:'<small>Diventa verde nel calendario</small>'}</span><label class="switch"><input type="checkbox" data-change="fbPaid" data-d="${ds}"${fb.paid?' checked':''} aria-label="Pagato"><span></span></label></div></div>`;
  else if(ds<=t&&st!=='pending')h+=`<button class="btn block mt" data-act="editFb" data-d="${ds}">${ICON.plus}Aggiungi ore fuori busta</button>`;
  if(fb||ds<=t)h+=`<p class="caption">Le ore fuori busta compaiono solo nel calendario: azzurre finché non le segni come pagate, poi verdi. Non entrano nella tabella mensile né nei totali.</p>`;
  if(fin)h+=`<p class="caption">Il mese è definitivo: le ore registrate sono in sola lettura.</p>`;
  else if(!r)h+=ovSection(ds,p,ov);
  openSheet(h,sh=>{if(ov)sh.dataset.ov=ov.tipo;});
}
function ovSection(ds,p,ov){const w=S.settings.weekly[parse(ds).getDay()];
  const st=ov?.start||p.start||w.start,en=ov?.end||p.end||endFrom(st);
  return `<div class="group-title">Modifica solo questo giorno</div>
  <div class="chips" data-name="ov" data-value="${ov?.tipo||''}">${[['ferie','Ferie'],['orario','Orario diverso'],['fuori','Fuori busta'],['riposo','Non lavorativo'],['festivo','Festività locale']]
    .map(([v,l])=>`<button data-act="seg" data-v="${v}" aria-pressed="${ov?.tipo===v}">${l}</button>`).join('')}</div>
  <div class="ovf ovf-time">${workFields(st,en,'ov',true)}<p class="caption">Vale anche per lavorare in un giorno libero.</p></div>
  <div class="ovf ovf-hol"><div class="list mt"><div class="li"><input class="inp wide" name="ovName" maxlength="60" placeholder="Nome (es. Santo patrono)" value="${esc(ov?.nome||'')}"></div></div></div>
  <div class="ovf ovf-any"><button class="btn primary block mt" data-act="ovSave" data-d="${ds}">Salva modifica</button></div>
  ${ov?`<button class="btn block mt danger" data-act="ovReset" data-d="${ds}">${ov.tipo==='ferie'?'Annulla ferie di questo giorno':'Ripristina orario ricorrente'}</button>`:''}
  <button class="link mt" data-act="planFerie" data-from="${ds}">${ICON.sun}Programma più giorni di ferie da qui</button>
  <p class="caption">L'orario settimanale ricorrente non viene modificato.</p>`;}

/* --- campi orario condivisi --- */
function workFields(s,e,prefix='',auto=false){const n=k=>prefix?prefix+cap(k):k;
  return `<div class="list mt"><div class="li"><span>Ingresso</span><input type="time" name="${n('start')}" value="${s}"${auto?' data-auto="1"':''}></div>
  <div class="li"><span>Uscita</span><input type="time" name="${n('end')}" value="${e}" data-end="1"></div></div>`;}
const calcBox=(l='Ore lavorate')=>`<div class="calc"><span>${l}</span><b class="num" data-c="w">0:00</b></div>`;
function updCalc(root){const f=readForm(root);const a=root.querySelector('[data-c=w]');if(a)a.textContent=fmtHM(spanMin(f.start,f.end));}
const absChips=t=>`<div class="chips" data-name="tipo" data-value="${t}">${Object.entries(ASSENZE).map(([k,l])=>`<button data-act="seg" data-v="${k}" aria-pressed="${k===t}">${l}</button>`).join('')}</div>`;
function readForm(root){const o={};
  root.querySelectorAll('[data-name]').forEach(g=>{o[g.dataset.name]=g.dataset.value;});
  root.querySelectorAll('input[name],textarea[name],select[name]').forEach(i=>{o[i.name]=i.type==='checkbox'?i.checked:i.value;});
  root.querySelectorAll('.stepper').forEach(s=>{o[s.dataset.name]=+s.dataset.val;});

/* --- editor registrazione --- */

/* --- editor fuori busta --- */
function openFb(ds){
  const f=fbOf(ds),r=S.records[ds],p=planFor(ds);
  const start=f?.start||(p.fb?p.start:(r&&r.stato==='lavorato'?r.end:'18:00')),end=f?.end||(p.fb?p.end:fromMin(((toMin(start)||0)+120)%1440));

  <div class="group-title">Note</div><textarea name="note" rows="2" maxlength="200" placeholder="Facoltative">${esc(f?.note||'')}</textarea>

  ${f?`<button class="btn block danger mt" data-act="delFb" data-d="${ds}">${ICON.trash}Elimina ore fuori busta</button>`:''}`,

}

/* ================= Conferma presenze ================= */
function openConfirm(list){
  if(!list.length||cf)return;closeSheet();
  const el=document.createElement('div');el.className='cf-overlay';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML=`<div class="cf-wrap"><div class="cf-top"><span class="pill warn sm" id="cfCount"></span><button class="link" data-act="cfLater">Più tardi</button></div><div class="cf-stage" id="cfStage"></div></div>`;
  document.body.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));
  cf={list:[...list],el};setInert(true);el.setAttribute('aria-label','Conferma presenze');cfShow();
}
function cfShow(){const ds=cf.list[0],n=cf.list.length;
  $('#cfCount').innerHTML=`${ICON.clock}<span>${plural(n,'giorno','giorni')} da confermare</span>`;
  const card=document.createElement('div');card.className='cf-card';card.dataset.d=ds;card.innerHTML=cfAsk(ds);$('#cfStage').appendChild(card);}
function cfAsk(ds){const p=planFor(ds),t=todayStr(),when=ds===t?'oggi':dayLabel(ds);
  return `<div class="cf-date">${ICON.cal}<span>${cap(dayLabel(ds))}${ds===t?' · oggi':''}</span>${p.fb?'<span class="tag fb">Fuori busta</span>':''}</div>
  <h2 class="cf-q">${p.fb?`Hai lavorato fuori busta ${when}?`:`Sei andato al lavoro ${when}?`}</h2>
  <p class="muted">Previsto ${p.start}–${p.end} · ${fmtHM(spanMin(p.start,p.end))} h</p>
  <div class="cf-btns"><button class="btn big" data-act="cfNo">No</button><button class="btn big primary" data-act="cfYes">Sì</button></div>`;}
function cfSwap(card,html){card.innerHTML=html;if(!reduced())card.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'});}
function cfNext(card){
  save();render();card.classList.add('leave');cf.list.shift();setTimeout(()=>card.remove(),320);
  if(cf.list.length)cfShow();else setTimeout(()=>cfClose(true),240);
}
function cfClose(done){if(!cf)return;const el=cf.el;cf=null;setInert(false);el.classList.remove('open');setTimeout(()=>el.remove(),260);
  if(done){toast('Giorni confermati');setTimeout(()=>{if(!checkPayment())checkMonthNotice();},420);}}
/* ================= Richiesta pagamento fuori busta (sabato) ================= */
function checkPayment(){if(cf||$('.sheet-layer'))return false;const{sat,list}=payWeek();
  if(!list.length||S.meta.fbAsked===sat)return false;openPay(list,sat);return true;}
function openPay(list,sat){if(!list.length)return toast('Nessuna ora fuori busta da pagare');
  const rows=list.map(ds=>{const f=fbOf(ds);return `<label class="li pay-li"><span>${cap(dayLabel(ds))}<small>${f.start}–${f.end} · ${fmtHM(fbMin(ds))} h</small></span><span class="check"><input type="checkbox" data-pay="${ds}" checked aria-label="Pagato ${dayLabel(ds)}"><i>${ICON.check}</i></span></label>`;}).join('');
  const upd=sh=>{const m=[...sh.querySelectorAll('input[data-pay]:checked')].reduce((a,i)=>a+fbMin(i.dataset.pay),0);sh.querySelector('[data-c=w]').textContent=fmtHM(m);};
  openSheet(`<div class="pay-icon">${ICON.euro}</div><h2>${sat?'Le ore fuori busta sono state pagate?':'Ore fuori busta da pagare'}</h2>
  <p class="muted">${sat?`Settimana fino a ${dayLabel(sat)}. `:''}Togli la spunta alle giornate non ancora pagate.</p>
  <div class="list mt pay-list">${rows}</div>${calcBox('Totale selezionato')}
  <div class="btn-row"><button class="btn" data-act="payNo">Non ancora</button><button class="btn primary" data-act="payYes">Segna pagate</button></div>`,
  sh=>{if(sat)sh.dataset.sat=sat;sh.addEventListener('change',()=>upd(sh));upd(sh);},{center:true});}

/* ================= Chiusura mese ================= */
function checkMonthNotice(){
  if(cf||$('.sheet-layer'))return;
  const ym=closedMonths().find(m=>!S.meta.noticeShown[m]);if(!ym)return;
  S.meta.noticeShown[ym]=true;save();
  const n=pendingList().filter(d=>ymOf(d)===ym).length;
  openSheet(`<div style="color:var(--st-pending);margin-bottom:10px">${ICON.alert}</div><h2>Il mese di ${monthName(ym)} è concluso, controlla le tue ore</h2>
  <p class="muted">La tabella è <b>provvisoria</b>: puoi correggere ogni giorno prima di confermarla definitivamente.${n?` Ci sono ancora ${plural(n,'giorno','giorni')} da confermare.`:''}</p>
  <div class="btn-row"><button class="btn" data-act="closeSheet">Più tardi</button><button class="btn primary" data-act="goMonth" data-ym="${ym}">Controlla</button></div>`,null,{center:true});
}
function playCheck(){const el=document.createElement('div');el.className='check-pop';el.innerHTML=`<div class="ring">${ICON.check}</div>`;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}

/* ================= Vista: Mese ================= */
function statusBadge(ym,anim=false){return isFinal(ym)?`<span class="badge def${anim?' appear':''}" id="stBadge">DEFINITIVA</span>`:`<span class="badge prov" id="stBadge">PROVVISORIA</span>`;}
let badgeAnim=null;
function vMese(){const ym=ui.mesYm,cur=ymOf(todayStr());
  const nav=`<div class="mnav"><button class="link" data-act="mesPrev">${ICON.left}${cap(monthName(ymAdd(ym,-1)))}</button>${ym<cur?`<button class="link" data-act="mesNext">${cap(monthName(ymAdd(ym,1)))}${ICON.right}</button>`:''}</div>`;
  const anim=badgeAnim===ym;badgeAnim=null;
  return head((ym===cur?'Mese corrente':'Mese')+statusBadge(ym,anim),ymLabel(ym))+nav+monthBody(ym,'mes');}
function totalsCard(t,k,label='Ore lavorate'){
  const absC=Object.entries(t.abs||{}).map(([a,n])=>`<span>${ASSENZE[a]||a} · ${n}</span>`).join('');
  return `<section class="card totals"><div class="label">${label}</div>
   <div class="hero num"><span data-count="${t.worked}" data-key="${k}w" data-fmt="hm">${fmtHM(t.worked)}</span><small>h</small></div>
   <div class="tiles tiles3"><div class="tile"><span class="v num" data-count="${t.days}" data-key="${k}d">${t.days}</span><span class="l">Giorni lavorati</span></div>
   <div class="tile"><span class="v num" data-count="${t.absDays}" data-key="${k}a">${t.absDays}</span><span class="l">Assenze</span></div>
   <div class="tile"><span class="v num" data-count="${avgDay(t)}" data-key="${k}m" data-fmt="hm">${fmtHM(avgDay(t))}</span><span class="l">Media al giorno</span></div></div>
   ${absC?`<div class="abs-chips">${absC}</div>`:''}</section>`;}
function monthBody(ym,ctx){
  const fin=isFinal(ym),t=totalsFor(ym),cur=ymOf(todayStr());
  let h=totalsCard(t,ctx+ym);
  if(!fin&&ctx==='mes'){
    if(ym<cur){const n=pendingList().filter(d=>ymOf(d)===ym&&!planFor(d).fb).length;
      h+=n?`<section class="card closebox"><p>Prima di chiudere ${monthName(ym)} conferma ${n===1?'il giorno ancora':`i ${n} giorni ancora`} in sospeso.</p><button class="btn primary block" data-act="openPendingMonth" data-ym="${ym}">Conferma ${plural(n,'giorno','giorni')}</button></section>`
        :`<section class="card closebox"><p>Il mese è concluso. Controlla le righe qui sotto: puoi modificarle toccandole. Quando è tutto corretto, conferma il mese.</p><button class="btn primary block" data-act="closeMonth" data-ym="${ym}">${ICON.check}Conferma mese</button></section>`;}
    else h+=`<div class="note-line">${ICON.clock}<span>Potrai confermare il mese dopo il ${daysInMonth(ym)} ${monthName(ym)}.</span></div>`;}
  if(fin)h+=`<div class="note-line">${ICON.shield}<span>Confermato il ${new Date(S.months[ym].chiusoIl).toLocaleDateString('it-IT')} · sola lettura</span></div>`;
  const rows=monthRows(ym);
  h+=`<div class="group-title">Giorni</div><section class="card rows">${rows.length?rows.map(rowHTML).join(''):'<p class="muted" style="padding:16px">Nessun giorno programmato in questo mese.</p>'}</section>`;
  h+=`<div class="group-title">Esporta</div><div class="exports"><button class="btn" data-act="pdf" data-ym="${ym}">${ICON.print}PDF</button><button class="btn" data-act="csv" data-ym="${ym}">${ICON.table}CSV (Excel)</button></div>`;
  return h;}
function rowHTML(x){const i=rowInfo(x),d=parse(x.ds);
  const cls=x.st==='pending'?' pend':(x.st==='planned'||x.st==='holiday')?' dim':'';
  return `<button class="mrow${cls}" data-act="row" data-d="${x.ds}"><i class="bar s-${x.st}"></i><span class="mdate"><b class="num">${d.getDate()}</b><small>${GG[d.getDay()]}</small></span>
  <span class="mmain"><span class="mt-t">${esc(i.title)}</span><span class="ms">${esc(i.sub)}</span></span>
  <span class="mright"><b class="num">${i.hours}</b></span></button>`;}
function rowDetail(ds){const r=S.records[ds],p=planFor(ds),c=calcRec(r);
  let h=sheetHead('Sola lettura',`${cap(dayLabel(ds))} ${ds.slice(0,4)}`)+'<div class="list">';
  if(r&&r.stato==='lavorato')h+=[['Ingresso',r.start],['Uscita',r.end],['Ore lavorate',fmtHM(c.worked)]].map(([a,b])=>`<div class="li"><span>${a}</span><b class="num">${b}</b></div>`).join('');
  else if(r)h+=`<div class="li"><span>Assenza</span><b>${ASSENZE[r.tipo]}</b></div>`;
  else h+=`<div class="li"><span>${planText(p)}</span></div><div class="li"><span>Nessuna registrazione</span></div>`;
  if(r?.note)h+=`<div class="li"><span>Note<small>${esc(r.note)}</small></span></div>`;

  openSheet(h);}

/* ================= Vista: Archivio ================= */
function vArch(){
  if(ui.archYm)return `<button class="link back" data-act="archBack">${ICON.left}Archivio</button>`+head('Archivio'+statusBadge(ui.archYm),ymLabel(ui.archYm))+monthBody(ui.archYm,'arc');

  const fins=Object.keys(S.months).filter(isFinal).sort().reverse();

  if(!fins.length)h+=`<div class="empty">${ICON.arch}<h2>Nessun mese confermato</h2><p>Quando confermi un mese, qui trovi la tabella definitiva con i totali e l'esportazione in PDF e CSV.</p></div>`;

    h+=`<div class="yr-head"><h2>${y}</h2><button class="link" data-act="yearSum" data-y="${y}">Riepilogo annuale${ICON.right}</button></div>`;

      return `<button class="card acard" data-act="archOpen" data-ym="${m}"><span class="ac-top"><span>${cap(monthName(m))}</span><span class="badge def sm">DEF.</span></span>
      <span class="ac-h num">${fmtHM(t.worked)}<small> h</small></span><span class="ac-meta">${plural(t.days,'giorno lavorato','giorni lavorati')}</span><span class="ac-meta">${t.absDays?plural(t.absDays,'assenza','assenze'):'Nessuna assenza'}</span></button>`;}).join('')}</div>`;
    else h+=`<p class="caption" style="margin:0 4px">Nessun mese confermato in questo anno.</p>`;}
  return h;}
function yearData(y){const out=[];for(let m=1;m<=12;m++){const ym=`${y}-${pad(m)}`;
  if(isFinal(ym)||Object.keys(S.records).some(d=>d.startsWith(ym)))out.push({ym,fin:isFinal(ym),t:totalsFor(ym)});}return out;}
function yearSum(rows){const s={worked:0,days:0,abs:{},absDays:0};
  for(const{t}of rows){s.worked+=t.worked;s.days+=t.days;s.absDays+=t.absDays;for(const[k,v]of Object.entries(t.abs||{}))s.abs[k]=(s.abs[k]||0)+v;}return s;}
const absText=abs=>Object.entries(abs||{}).map(([k,n])=>`${ASSENZE[k]||k} ${n}`).join(' · ');
function yearBody(y){const rows=yearData(y),s=yearSum(rows);
  if(!rows.length)return `<div class="empty">${ICON.table}<h2>Nessun dato</h2><p>Non ci sono ore registrate nel ${y}.</p></div>`;
  const line=(t)=>[plural(t.days,'giorno','giorni'),absText(t.abs)].filter(Boolean).join(' · ');
  return totalsCard(s,'y'+y,`Ore lavorate nel ${y}`)+
  `<div class="group-title">Per mese</div><section class="card rows">${rows.map(({ym,fin,t})=>`<button class="yrow" data-act="yrOpen" data-ym="${ym}">
    <span class="yr-l"><span class="yr-m">${cap(monthName(ym))}${fin?'':'<span class="badge prov sm">PROVVISORIA</span>'}</span><span class="ms">${line(t)}</span></span>

function openSheet(html,onMount,opts={}){
  document.querySelectorAll('.sheet-layer').forEach(o=>o.remove());
  const L=document.createElement('div');L.className='sheet-layer'+(opts.center?' center':'');
  L.innerHTML=`<div class="backdrop" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>${html}</div>`;
  document.body.appendChild(L);const sh=L.querySelector('.sheet');onMount&&onMount(sh);setInert(true);
  const t=sh.querySelector('h2');if(t)sh.setAttribute('aria-label',t.textContent);setTimeout(()=>sh.focus({preventScroll:true}),50);sh.tabIndex=-1;
  requestAnimationFrame(()=>requestAnimationFrame(()=>L.classList.add('open')));return sh;}
function closeSheet(){const L=$('.sheet-layer');document.querySelectorAll('.day.sel').forEach(d=>d.classList.remove('sel'));
  if(!L)return;L.classList.remove('open');L.style.pointerEvents='none';if(!cf)setInert(false);setTimeout(()=>L.remove(),340);}
function setInert(on){['#view','.tabbar'].forEach(q=>{const e=$(q);if(e)e.inert=on;});}
function confirmDialog(title,text,ok,onOk,danger=false){
  openSheet(`<h2>${title}</h2><p class="muted">${text}</p><div class="btn-row"><button class="btn" data-act="closeSheet">Annulla</button><button class="btn ${danger?'danger':'primary'}" data-act="dlgOk">${ok}</button></div>`,sh=>{sh._ok=onOk;},{center:true});}

/* ================= Esportazione ================= */
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function download(name,content,type){
  const blob=new Blob([content],{type});
  if(isIOS()&&navigator.canShare){try{const file=new File([blob],name,{type});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}}catch(e){if(e.name==='AbortError')return false;}}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true;}
const csvCell=v=>{v=String(v??'');return /[";\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;};
const toCSV=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
function csvMonth(ym){const t=totalsFor(ym);
  const rows=[[`Riepilogo ore ${ymLabel(ym)}`,isFinal(ym)?'DEFINITIVA':'PROVVISORIA'],[],
    ['Data','Giorno','Ingresso','Uscita','Ore lavorate','Ore lavorate (decimali)','Tipo','Note']];
  for(const x of monthRows(ym,true)){const r=x.r,i=rowInfo(x),w=r?.stato==='lavorato';
    rows.push([fmtIt(x.ds),cap(GIORNI[parse(x.ds).getDay()]),w?r.start:'',w?r.end:'',w?fmtHM(x.c.worked):'',w?fmtDec(x.c.worked):'',i.type,r?.note||(x.st==='holiday'?x.p.hol:'')]);}
  rows.push([],['Totali'],['Ore lavorate',fmtHM(t.worked),fmtDec(t.worked)],['Giorni lavorati',t.days],['Giorni di assenza',t.absDays]);
  for(const[k,l]of Object.entries(ASSENZE))if(t.abs?.[k])rows.push([`Assenze: ${l}`,t.abs[k]]);
  download(`ore-${ym}.csv`,toCSV(rows),'text/csv;charset=utf-8');}
function csvYear(y){const rows=yearData(y),s=yearSum(rows),cols=Object.keys(ASSENZE);
  const out=[[`Riepilogo annuale ${y}`],[],['Mese','Stato','Ore lavorate','Ore (decimali)','Giorni lavorati',...cols.map(c=>ASSENZE[c])]];
  for(const{ym,fin,t}of rows)out.push([cap(monthName(ym)),fin?'Definitiva':'Provvisoria',fmtHM(t.worked),fmtDec(t.worked),t.days,...cols.map(c=>t.abs?.[c]||0)]);
  out.push(['Totale','',fmtHM(s.worked),fmtDec(s.worked),s.days,...cols.map(c=>s.abs[c]||0)]);
  download(`ore-riepilogo-${y}.csv`,toCSV(out),'text/csv;charset=utf-8');}
function printMonth(ym){const fin=isFinal(ym),t=totalsFor(ym);
  const body=monthRows(ym,true).map(x=>{const r=x.r,i=rowInfo(x),w=r?.stato==='lavorato',d=parse(x.ds);
    return `<tr class="${!r&&x.st!=='pending'?'dim':''}"><td>${fmtIt(x.ds)}</td><td>${cap(GIORNI[d.getDay()])}</td><td>${w?r.start:''}</td><td>${w?r.end:''}</td><td class="r">${w?fmtHM(x.c.worked):''}</td><td>${w||i.type==='Riposo'?'':esc(i.type)}</td><td>${esc(r?.note||(x.st==='holiday'?x.p.hol:''))}</td></tr>`;}).join('');
  const abs=absText(t.abs);
  $('#print-area').innerHTML=`<div class="p-head"><div><h1>Riepilogo ore lavorate</h1><div class="sub">${ymLabel(ym)}</div></div><div class="p-badge ${fin?'':'prov'}">${fin?'DEFINITIVA':'PROVVISORIA'}</div></div>
  <table><thead><tr><th>Data</th><th>Giorno</th><th>Ingresso</th><th>Uscita</th><th class="r">Ore</th><th>Assenza / tipo</th><th>Note</th></tr></thead><tbody>${body}</tbody></table>
  <div class="p-tot"><div><span>Ore lavorate</span><b>${fmtHM(t.worked)}</b></div><div><span>Giorni lavorati</span><b>${t.days}</b></div><div><span>Giorni di assenza</span><b>${t.absDays}</b></div></div>
  ${abs?`<div class="p-abs">Assenze per tipo: ${abs}</div>`:''}
  <div class="p-sign"><div>Firma del dipendente</div><div>Firma del responsabile</div></div>
  <div class="p-foot"><span>Ore lavorate = uscita − ingresso</span><span>${fin?`Confermato il ${new Date(S.months[ym].chiusoIl).toLocaleDateString('it-IT')}`:`Generato il ${new Date().toLocaleDateString('it-IT')}`}</span></div>`;
  setTimeout(()=>window.print(),60);}
function printYear(y){const rows=yearData(y),s=yearSum(rows),cols=Object.keys(ASSENZE);
  $('#print-area').innerHTML=`<div class="p-head"><div><h1>Riepilogo annuale</h1><div class="sub">${y}</div></div></div>
  <table><thead><tr><th>Mese</th><th>Stato</th><th class="r">Ore</th><th class="r">Giorni</th>${cols.map(c=>`<th class="r">${ASSENZE[c]}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(({ym,fin,t})=>`<tr><td>${cap(monthName(ym))}</td><td>${fin?'Definitiva':'Provvisoria'}</td><td class="r">${fmtHM(t.worked)}</td><td class="r">${t.days}</td>${cols.map(c=>`<td class="r">${t.abs?.[c]||''}</td>`).join('')}</tr>`).join('')}</tbody>
  <tfoot><tr><td>Totale</td><td></td><td class="r">${fmtHM(s.worked)}</td><td class="r">${s.days}</td>${cols.map(c=>`<td class="r">${s.abs[c]||''}</td>`).join('')}</tr></tfoot></table>
  <div class="p-foot"><span>Generato il ${new Date().toLocaleDateString('it-IT')}</span></div>`;
  setTimeout(()=>window.print(),60);}

/* ================= Backup ================= */
async function exportBackup(){
  const prev=S.meta.lastBackup;S.meta.lastBackup=iso();
  const data={app:'ore-lavoro',formato:1,esportatoIl:S.meta.lastBackup,dati:S};
  const ok=await download(`backup-ore-${todayStr()}.json`,JSON.stringify(data,null,2),'application/json');
  if(ok){S.meta.backupSnoozeUntil=0;save();render();toast('Backup esportato');}else S.meta.lastBackup=prev;}
function validBackup(d){return d&&typeof d==='object'&&d.settings&&d.settings.weekly&&typeof d.records==='object';}
async function importBackup(file){
  let j;try{j=JSON.parse(await file.text());}catch(e){return toast('Impossibile leggere il file: scegli un backup .json');}
  const d=j&&j.dati?j.dati:j;if(!validBackup(d))return toast('Questo file non è un backup di OreLavoro');
  const n=Object.keys(d.records).length;
  confirmDialog('Importare il backup?',`Il file contiene ${plural(n,'giorno registrato','giorni registrati')}. Tutti i dati attuali verranno sostituiti.`,'Sostituisci i dati',()=>{
    S=normalize(d);holCache={};save();ui.calYm=ui.mesYm=ymOf(todayStr());render();toast('Backup importato');});}

    <div class="f-time">${workFields(w.start,w.end,'',true)}${calcBox('Ore previste')}</div>
    <p class="caption f-fb">Le giornate fuori busta ti vengono chieste come le altre, ma restano fuori da tabella e totali. Il sabato, a fine lavoro, ti chiedo se sono state pagate.</p>
    <button class="btn primary block mt" data-act="saveDay" data-i="${i}">Salva</button>
    <p class="caption">Vale per tutte le settimane, compresi i giorni passati non ancora confermati.</p>`,sh=>{sh.dataset.tipo=tipo;sh.addEventListener('input',()=>updCalc(sh));updCalc(sh);});},
  saveDay:el=>{const i=+el.dataset.i,f=readForm(el.closest('.sheet'));
    if(f.tipo!=='riposo'&&spanMin(f.start,f.end)<=0)return toast(ERR_TIME);
    S.settings.weekly[i]={on:f.tipo!=='riposo',fb:f.tipo==='fuori',start:f.start,end:f.end};save();closeSheet();render();toast('Orario aggiornato');},
  addHol:()=>{openSheet(`${sheetHead('Festività personalizzata','Nuova festività')}<div class="list"><div class="li"><input class="inp wide" name="name" maxlength="60" placeholder="Nome (es. San Giovanni)"></div>
    <div class="li"><span>Giorno</span><select name="d">${Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div>
    <div class="li"><span>Mese</span><select name="m">${MESI.map((m,i)=>`<option value="${i+1}">${cap(m)}</option>`).join('')}</select></div></div>
    <p class="caption">Si ripete ogni anno nella stessa data.</p><button class="btn primary block mt" data-act="saveHol">Aggiungi</button>`);},
  saveHol:el=>{const f=readForm(el.closest('.sheet'));const name=(f.name||'').trim();if(!name)return toast('Inserisci un nome');
    const m=+f.m,d=Math.min(+f.d,new Date(2024,m,0).getDate());
    S.settings.customHolidays.push({md:`${pad(m)}-${pad(d)}`,name});holCache={};save();closeSheet();render();toast('Festività aggiunta');},
  planFerie:el=>{closeSheet();const from=el.dataset.from||todayStr();
    setTimeout(()=>openSheet(`${sheetHead('Ferie','Programma ferie')}
    <div class="list"><div class="li"><span>Dal</span><input type="date" name="from" value="${from}"></div><div class="li"><span>Al</span><input type="date" name="to" value="${from}"></div></div>
    <div class="calc"><span>Giorni di ferie</span><b class="num" data-c="n">0</b></div>
    <div class="group-title">Nota</div><input class="inp wide list-inp" name="note" maxlength="60" placeholder="Facoltativa (es. Vacanze estive)">
    <p class="caption">Contano solo i giorni lavorativi: weekend, festivi e giorni fuori busta restano esclusi.</p>
    <button class="btn primary block mt" data-act="saveFerie">Segna ferie</button>`,sh=>{
      const upd=()=>{const f=readForm(sh);const ok=f.from&&f.to&&f.to>=f.from;const n=ok?ferieDays(f.from,f.to).length:0;
        sh.querySelector('[data-c=n]').textContent=n;const b=sh.querySelector('[data-act=saveFerie]');b.textContent=n?`Segna ${plural(n,'giorno','giorni')} di ferie`:'Nessun giorno lavorativo';b.disabled=!n;};
      sh.addEventListener('input',e=>{if(e.target.name==='from'){const to=sh.querySelector('[name=to]');if(!to.value||to.value<e.target.value)to.value=e.target.value;}upd();});upd();}),120);},
  saveFerie:el=>{const f=readForm(el.closest('.sheet'));if(!f.from||!f.to||f.to<f.from)return toast('La data di fine deve essere dopo quella di inizio');
    const days=ferieDays(f.from,f.to);if(!days.length)return toast('Nel periodo non ci sono giorni lavorativi');
    days.forEach(ds=>{S.overrides[ds]={tipo:'ferie',note:(f.note||'').trim()};});autoFerie();save();closeSheet();ui.calYm=ymOf(days[0]);render();
    toast(`${plural(days.length,'giorno','giorni')} di ferie programmati`);},
  delFerie:el=>{const{from,to}=el.dataset;const ds=Object.keys(S.overrides).filter(k=>S.overrides[k].tipo==='ferie'&&!S.records[k]&&k>=from&&k<=to);
    confirmDialog('Annullare queste ferie?',`${plural(ds.length,'giorno torna','giorni tornano')} a seguire l'orario settimanale.`,'Annulla ferie',()=>{ds.forEach(k=>delete S.overrides[k]);save();render();toast('Ferie annullate');},true);},
  delHol:el=>{const i=+el.dataset.i,h=S.settings.customHolidays[i];
    confirmDialog('Eliminare la festività?',`${esc(h.name)} non sarà più considerata festiva.`,'Elimina festività',()=>{S.settings.customHolidays.splice(i,1);holCache={};save();render();},true);},
  wipe:()=>confirmDialog('Cancellare tutti i dati?','Orari, registrazioni e archivio verranno eliminati da questo dispositivo. L\'operazione non si può annullare.','Cancella tutto',()=>{
    S=defaults();holCache={};save();render();toast('Dati cancellati');},true),
};
const CH={
  toggleDay:el=>{const w=S.settings.weekly[+el.dataset.i];w.on=el.checked;if(w.on&&!w.fb)w.end=endFrom(w.start);save();setTimeout(render,250);},
  fbPaid:el=>{const f=S.fuori[el.dataset.d];if(!f)return;f.paid=el.checked;f.paidAt=el.checked?iso():null;save();render();toast(el.checked?'Segnata come pagata':'Segnata come da pagare');},
  startDate:el=>{if(!el.value)return;S.settings.startDate=el.value;save();toast('Data di inizio aggiornata');},
};

/* ================= Avvio ================= */
function startupChecks(){
  if(cf||$('.sheet-layer'))return;
  if(autoFerie())render();
  const list=pendingList();
  if(list.length&&!ui.snoozed){openConfirm(list);return;}
  if(checkPayment())return;
  checkMonthNotice();
}
async function init(){
  await load();
  autoFerie();
  render();
  document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f)f(el,e);});
  document.addEventListener('change',e=>{const el=e.target;if(el.id==='fileIn'){if(el.files[0])importBackup(el.files[0]);el.value='';return;}
    const f=CH[el.dataset.change];if(f)f(el);});
  document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.auto&&el.value&&el.closest('.sheet')?.dataset.tipo!=='fuori'){const end=el.closest('.list')?.querySelector('input[data-end]');if(end)end.value=endFrom(el.value);}},true);
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
  document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.sheet-layer'))closeSheet();else if(cf)A.cfLater();}});
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden'){lastHidden=Date.now();return;}
    if(Date.now()-lastHidden>10*60e3)ui.snoozed=false;
    if(lastDay!==todayStr()){lastDay=todayStr();ui.calYm=ui.mesYm=ymOf(lastDay);}
    if(!cf&&!$('.sheet-layer'))render();
    setTimeout(startupChecks,300);
  });
  setTimeout(startupChecks,450);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();

</script>
</body>
</html>
